<div class="dashboard-container">
  <app-header
    [theme]="theme()"
    [form]="form"
    [fields]="fields"
    [model]="model()"
    [btcTicker]="btcTicker()"
    [viewMode]="viewMode()"
    (themeToggle)="toggleTheme()"
    (modelChange)="onModelChange()"
    (viewModeChange)="viewMode.set($event)"
  >
  </app-header>

  <app-ticker-grid
    [tickers]="tickers()"
    [isLoading]="isLoading()"
    [viewMode]="viewMode()"
    (suggestionClicked)="handleSuggestion($event)"
    (restoreDefaults)="handleRestoreDefaults()"
    (tickerSelected)="handleTickerSelection($event)"
  >
  </app-ticker-grid>

  <app-footer></app-footer>
</div>
