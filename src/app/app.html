<div class="dashboard-container">
  <app-header 
    [theme]="theme()"
    [form]="form"
    [fields]="fields"
    [model]="model()"
    [btcTicker]="btcTicker()"
    (themeToggle)="toggleTheme()"
    (modelChange)="onModelChange()">
  </app-header>

  <app-ticker-grid 
    [tickers]="tickers()" 
    [isLoading]="isLoading()"
    (suggestionClicked)="handleSuggestion($event)"
    (restoreDefaults)="handleRestoreDefaults()">
  </app-ticker-grid>

  <app-footer></app-footer>
</div>
